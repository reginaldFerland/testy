name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The Node version of the minimum supported VS Code's extension host.
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - run: npm ci

      # Compile once; every later step uses the :only variants so nothing rebuilds.
      - name: Compile
        run: npm run compile

      - run: npm run lint

      - run: npm run typecheck:tests

      - name: Unit tests
        if: runner.os != 'Linux'
        run: npm run test:unit:only

      # Unit tests with the TypeScript line-coverage gate (threshold in the coverage script).
      - name: Unit tests with coverage gate
        if: runner.os == 'Linux'
        run: npm run coverage

      - name: Localization bundle is current
        if: runner.os == 'Linux'
        run: |
          npm run l10n:export
          git diff --exit-code -- l10n/
          test -z "$(git status --porcelain -- l10n/)"

      - name: .NET helper tests
        run: npm run test:dotnet

      - name: Integration tests
        run: npm run test:integration:only

      - name: Extension tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension:only

      - name: Extension tests
        if: runner.os != 'Linux'
        run: npm run test:extension:only

  # The extension host of the oldest VS Code that engines.vscode allows.
  extension-min:
    name: Extension tests (minimum VS Code)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTY_VSCODE_VERSION: min
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - run: npm ci

      - run: npm run compile

      - run: xvfb-run -a npm run test:extension:only

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - run: npm ci

      # vsce runs vscode:prepublish (lint, release helpers, minified bundle) before packaging.
      - run: npx vsce package --no-dependencies --out testy.vsix

      - name: Assert VSIX file list
        run: npm run check:vsix -- --vsix testy.vsix

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: testy-vsix
          path: testy.vsix
          if-no-files-found: error
