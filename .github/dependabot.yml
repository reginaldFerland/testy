version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  # Test fixtures: MSTest.Sdk, xunit.v3.mtp-v2 and NUnit versions.
  - package-ecosystem: nuget
    directories:
      - /test/fixtures/*
      - /test/fixtures/*/*
    schedule:
      interval: weekly
    groups:
      nuget-fixtures:
        patterns: ['*']

  # The SDK pinned by the root global.json (the fixtures' global.json files pin no SDK).
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
